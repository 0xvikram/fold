<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#888;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.banner{width:1920px;height:384px;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 30% 0%,#f8f1e2,#e9dcc3)}
.banner .grid{position:absolute;inset:0;background-image:linear-gradient(#26253608 1px,transparent 1px),linear-gradient(90deg,#26253608 1px,transparent 1px);background-size:48px 48px}
.banner .word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#262536}
.banner .word b{display:block;font-size:150px;letter-spacing:-.04em;line-height:.9;font-weight:800}
.banner .word span{display:block;font-size:34px;color:#6d6a78;margin-top:14px;font-weight:600}
.banner svg{position:absolute}
.icon{width:256px;height:256px;background:radial-gradient(120% 100% at 30% 10%,#f8f1e2,#ede2cd);position:relative;overflow:hidden;margin-top:20px}
</style></head><body>
<div class="banner" id="banner">
  <div class="grid"></div>
  <!-- left: a square mid-fold -->
  <svg width="420" height="420" viewBox="0 0 100 100" style="left:120px;top:-10px;transform:rotate(-8deg)">
    <polygon points="10,20 80,20 80,90 10,90" fill="#fffcf3" stroke="#ddd2bd" stroke-width="1"/>
    <polygon points="80,20 80,90 45,55" fill="#ffb48a" opacity=".95"/>
    <line x1="80" y1="20" x2="45" y2="55" stroke="#e5533d" stroke-width="1.2" stroke-dasharray="3 2"/>
  </svg>
  <!-- right: target silhouette with stripes -->
  <svg width="380" height="380" viewBox="0 0 100 100" style="right:140px;top:10px;transform:rotate(7deg)">
    <defs><pattern id="st" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#e5533d" opacity=".35"/></pattern></defs>
    <polygon points="15,30 60,15 85,40 70,85 30,80" fill="url(#st)" stroke="#e5533d" stroke-width="1.6"/>
  </svg>
  <div class="word"><b>Fold</b><span>A new paper every day. Fold it into the shape.</span></div>
</div>
<div class="icon" id="icon">
  <svg width="256" height="256" viewBox="0 0 100 100">
    <polygon points="18,18 82,18 82,82 18,82" fill="#fffcf3" stroke="#262536" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="82,18 82,82 50,50" fill="#e5533d"/>
    <polygon points="82,18 50,50 82,82" fill="none" stroke="#262536" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</div>
</body></html>
